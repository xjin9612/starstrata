name: Daily

on:
  schedule:
    # 每天 UTC 21:17（台灣時間 05:17）與備援的 UTC 03:47（台灣時間 11:47）。負載高時 GitHub 會延後
    # 排程的執行，每小時開頭負載最高，負載夠高時排程可能被丟棄。兩個時段都由 check job 檢查，
    # 當天已收集完整時跳過。
    - cron: "17 21 * * *"
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

env:
  DB_TAG: db
  DB_FILE: starstrata.sqlite
  TZ: Asia/Taipei
  # 直接從原始碼執行，不建置套件，避免安裝未經 hash 驗證的建置工具。
  PYTHONPATH: src

jobs:
  # 排程觸發時，當天已收集完整就跳過 daily。concurrency 讓同時觸發的執行排隊，
  # 後到的執行在前一次 push 完資料後才檢查。手動執行一律不跳過。
  check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.collected.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # 先存進變數：腳本出錯時步驟失敗，daily 照常執行，check 顯示失敗。
      - name: 檢查今天是否已收集完整
        id: collected
        run: |
          skip=$(python scripts/collected_today.py)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  daily:
    needs: check
    # 資料與 DB release 只屬於 main，從其他分支手動執行時不做任何事。
    # check 被略過或失敗時照常執行，檢查本身出問題不能擋住收集。
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 80
    permissions:
      contents: write
    outputs:
      site: ${{ steps.site.outputs.uploaded }}
      locale: ${{ steps.locale.outputs.locale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 取分支最新的 commit，重跑或排隊的執行才看得到先前已 push 的當天資料。
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # uv 的 checksum 內建在固定 SHA 的 setup-uv 裡，require-checksums 讓不在內建清單的版本直接失敗。
      # Dependabot 不會更新 version。
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          require-checksums: true
          # 與 CI 的快取 key 相同但內容不同（不含 dev 群組），每天只跑一次，不使用快取。
          enable-cache: false
      # 失敗通知依 i18n.locale 選用語言；讀不到時用繁中。
      - name: 讀取語言
        id: locale
        continue-on-error: true
        run: python -c 'import tomllib; print("locale=" + tomllib.load(open("config.toml", "rb"))["i18n"]["locale"])' >> "$GITHUB_OUTPUT"
      - name: 安裝相依套件（依 uv.lock 驗證 hash）
        run: uv sync --locked --no-dev --no-install-project

      - name: 下載 DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$DB_TAG" --pattern "$DB_FILE.gz" --clobber; then
            gunzip -f "$DB_FILE.gz" || { echo "::warning::DB 解壓失敗，將從快照重建"; rm -f "$DB_FILE" "$DB_FILE.gz"; }
          else
            echo "沒有既有的 DB，將從快照重建"
          fi

      # 讓卡住的步驟提前結束。官方文件沒有說明逾時是否套用 continue-on-error（未查證）。
      - name: 收集
        id: collect
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: uv run --no-sync python -m starstrata collect

      - name: 匯入
        id: ingest
        continue-on-error: true
        run: uv run --no-sync python -m starstrata ingest

      # 翻譯失敗時各處顯示原文，下次執行再補，所以不列入下方的各步驟結果。
      - name: 翻譯說明
        id: translate
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync python -m starstrata translate

      - name: 回補歷史
        id: backfill
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: uv run --no-sync python -m starstrata backfill

      - name: 定期報告
        id: report
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync python -m starstrata report due

      - name: 通知
        id: notify
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        run: uv run --no-sync python -m starstrata notify

      # 前面任何步驟失敗、甚至 job 被取消，都要嘗試保住當天已收集的快照，Trending 無法事後補抓。
      - name: commit 並 push 資料
        id: push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in data reports; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "沒有新資料"
            exit 0
          fi
          git commit -q -m "chore(data): $(date +%F) 每日快照"
          for attempt in 1 2 3; do
            if git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2> /dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error::push 失敗三次"
          exit 1

      # DB 只在快照已 push 後上傳，DB 裡的資料一定能在 git 找到。
      - name: 上傳 DB
        if: ${{ !cancelled() && steps.ingest.outcome == 'success' && steps.push.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -kf "$DB_FILE"
          if ! gh release view "$DB_TAG" > /dev/null 2>&1; then
            gh release create "$DB_TAG" --latest=false --title "SQLite DB" \
              --notes "由 daily workflow 每天更新。DB 可由 data/ 的快照重建。"
          fi
          gh release upload "$DB_TAG" "$DB_FILE.gz" --clobber

      - name: 產生 dashboard
        id: build_site
        if: ${{ !cancelled() && steps.ingest.outcome == 'success' }}
        run: uv run --no-sync python -m starstrata site --out _site

      - id: upload_site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !cancelled() && steps.build_site.outcome == 'success' }}
        with:
          path: _site
          # repo 名稱可以用 . 開頭（例如 owner/.github），預設會排除這類詳細檔。
          include-hidden-files: true

      - name: 記錄 dashboard 已上傳
        id: site
        if: ${{ !cancelled() && steps.upload_site.outcome == 'success' }}
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: 各步驟結果
        if: >-
          ${{ !cancelled() && (
            steps.collect.outcome == 'failure' ||
            steps.ingest.outcome == 'failure' ||
            steps.backfill.outcome == 'failure' ||
            steps.report.outcome == 'failure' ||
            steps.notify.outcome == 'failure'
          ) }}
        run: |
          echo "::error::collect ${{ steps.collect.outcome }}、ingest ${{ steps.ingest.outcome }}、backfill ${{ steps.backfill.outcome }}、report ${{ steps.report.outcome }}、notify ${{ steps.notify.outcome }}"
          exit 1

      - name: 失敗通知
        if: ${{ failure() || cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCALE: ${{ steps.locale.outputs.locale }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          if [ "$LOCALE" = "en" ]; then
            text="starstrata daily workflow failed or timed out: $RUN_URL"
          else
            text="starstrata daily workflow 失敗或逾時：$RUN_URL"
          fi
          args=(--data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text")
          # 去掉前後空白後，空值不帶主題，同 cli.thread_id；其他值照帶，不合法時由 Telegram 拒絕。
          thread="$TELEGRAM_THREAD_ID"
          thread="${thread#"${thread%%[![:space:]]*}"}"
          thread="${thread%"${thread##*[![:space:]]}"}"
          if [ -n "$thread" ]; then
            args+=(--data-urlencode "message_thread_id=$thread")
          fi
          curl -sS --fail -o /dev/null "${args[@]}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

  deploy:
    # daily 因收集失敗而標為失敗時，dashboard 仍照常部署。
    needs: daily
    if: ${{ !cancelled() && needs.daily.outputs.site == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: 失敗通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCALE: ${{ needs.daily.outputs.locale }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          if [ "$LOCALE" = "en" ]; then
            text="starstrata dashboard deployment failed: $RUN_URL"
          else
            text="starstrata dashboard 部署失敗：$RUN_URL"
          fi
          args=(--data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text")
          # 去掉前後空白後，空值不帶主題，同 cli.thread_id；其他值照帶，不合法時由 Telegram 拒絕。
          thread="$TELEGRAM_THREAD_ID"
          thread="${thread#"${thread%%[![:space:]]*}"}"
          thread="${thread%"${thread##*[![:space:]]}"}"
          if [ -n "$thread" ]; then
            args+=(--data-urlencode "message_thread_id=$thread")
          fi
          curl -sS --fail -o /dev/null "${args[@]}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
