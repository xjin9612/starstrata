<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>starstrata — GitHub 趨勢地層</title>
<!-- site:meta -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // 在第一次繪製前套用使用者選的主題，避免閃爍
  try { const t = localStorage.getItem('starstrata-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要內容</a>

<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="#/trending" aria-label="starstrata 首頁">
      <img class="icon" src="icon.svg" width="32" height="32" alt="">
      starstrata
    </a>
    <span class="hdr-date"><span class="lbl">資料日期 </span><time id="hdrDate"></time></span>
    <div class="hdr-tools">
      <div class="search" role="search">
        <label class="search-box">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr">搜尋 repo</span>
          <input id="q" type="search" placeholder="搜尋 repo…" autocomplete="off" spellcheck="false"
            role="combobox" aria-expanded="false" aria-controls="qList" aria-autocomplete="list">
          <span class="kbd" aria-hidden="true">/</span>
        </label>
        <div class="dropdown" id="qPanel" hidden>
          <ul class="dd-list" id="qList" role="listbox" aria-label="符合的 repo"></ul>
          <div id="qFoot"></div>
        </div>
      </div>
      <button type="button" class="theme-btn" id="themeBtn"></button>
    </div>
  </div>
  <div class="strata" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <dl class="kpis" id="kpis" aria-label="重點數字"></dl>
  <nav class="tabs" id="tabs" aria-label="分頁"></nav>
  <div id="view"></div>
</main>

<footer class="foot">
  <div class="foot-in">
    <p>資料來源：GitHub Trending 與 Search，每日更新。</p>
    <!-- site:repo-link -->
    <a class="gh-link" href="__REPO_URL__" target="_blank" rel="noopener noreferrer">
      <svg class="icon" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      __REPO_NAME__<span class="sr">（GitHub，另開分頁）</span>
    </a>
    <!-- /site:repo-link -->
  </div>
</footer>


<div class="sr" aria-live="polite" id="live"></div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
